name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - dev-frontend

jobs:
  build-and-deploy-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push frontend image
      run: |
        docker build -t solar-frontend ./frontend
        docker tag solar-frontend:latest ${{ steps.login-ecr.outputs.registry }}/solar-frontend:latest
        docker push ${{ steps.login-ecr.outputs.registry }}/solar-frontend:latest

    - name: Setup kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_CONTENT }}" > ~/.kube/config

    - name: Deploy Frontend via Helm
      run: |
        helm upgrade --install frontend ./helm/frontend \
          --set image.repository=${{ steps.login-ecr.outputs.registry }}/solar-frontend \
          --set image.tag=latest
