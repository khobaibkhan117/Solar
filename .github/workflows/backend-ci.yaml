name: Backend CI/CD

on:
  push:
    branches:
      - main
      - dev-backend

jobs:
  build-and-deploy-backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push backend image
      run: |
        docker build -t solar-backend ./backend
        docker tag solar-backend:latest ${{ steps.login-ecr.outputs.registry }}/solar-backend:latest
        docker push ${{ steps.login-ecr.outputs.registry }}/solar-backend:latest

    - name: Setup kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_CONTENT }}" > ~/.kube/config

    - name: Deploy Backend via Helm
      run: |
        helm upgrade --install backend ./helm/backend \
          --set image.repository=${{ steps.login-ecr.outputs.registry }}/solar-backend \
          --set image.tag=latest
